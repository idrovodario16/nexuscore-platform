name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-fictional-password
          POSTGRES_DB: nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://nexus:ci-fictional-password@localhost:5432/nexus
      API_KEY: ci-fictional-key-at-least-32-characters
      ORGANIZATION_ID: 11111111-1111-4111-8111-111111111111
      RUN_INTEGRATION: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: api
      - run: npm run migrate
        working-directory: api
      - name: Provision restricted runtime role
        run: psql "${DATABASE_URL/postgresql+psycopg/postgresql}" -v ON_ERROR_STOP=1 -f api/scripts/runtime-role.sql
      - run: npm test
        working-directory: api
      - name: Workspace browser tests with real backend
        run: npm run test:browser
        env:
          WORKSPACE_BROWSER_INTEGRATION: '1'
      - run: docker build -f api/Dockerfile -t nexus-api-ci .
      - run: docker build -f Dockerfile.web -t nexus-web-ci .
      - name: Build Workspace image
        run: docker build --build-arg VITE_NEXUS_WORKSPACE=1 -f Dockerfile.web -t nexus-workspace-ci .
