services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: nexuscore
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["core_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuscore"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@db:5432/nexuscore
      API_KEY: ${API_KEY:?Set API_KEY}
      ORGANIZATION_ID: ${ORGANIZATION_ID}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:8080:80"]
volumes:
  core_data:
